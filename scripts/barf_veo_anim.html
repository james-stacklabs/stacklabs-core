<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #000;
  }
  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  
  .bg-image {
    position: absolute;
    width: 120%;
    height: 120%;
    background-image: url('file:///home/james/.gemini/antigravity/brain/4a247184-1459-478b-b1aa-f55dd61c57db/barf_base_anim_layer_1776643032806.png');
    background-size: cover;
    background-position: center;
    transform-origin: 50% 80%;
    /* Subtle camera pan/zoom */
    animation: pan 8s ease-in-out forwards;
  }

  /* Intense shaking to simulate the "head banging meltdown" */
  @keyframes pan {
    0%   { transform: scale(1.0) translate(0px, 0px); filter: brightness(1) sepia(0.2); }
    10%  { transform: scale(1.05) translate(-5px, 5px); }
    15%  { transform: scale(1.05) translate(5px, -5px); filter: brightness(1.2); }
    20%  { transform: scale(1.05) translate(-10px, 10px); }
    25%  { transform: scale(1.02) translate(10px, -10px); filter: brightness(0.8); }
    30%  { transform: scale(1.05) translate(-5px, 5px); }
    40%  { transform: scale(1.08) translate(0px, 10px); filter: brightness(1.3) sepia(0.4); }
    45%  { transform: scale(1.08) translate(8px, -10px); }
    50%  { transform: scale(1.1) translate(-10px, 15px); filter: brightness(0.9); }
    55%  { transform: scale(1.1) translate(15px, -15px); }
    60%  { transform: scale(1.1) translate(0px, 0px); filter: brightness(1.5); }
    70%  { transform: scale(1.12) translate(-5px, 5px); }
    80%  { transform: scale(1.15) translate(5px, -5px); filter: brightness(1.1); }
    90%  { transform: scale(1.18) translate(-10px, 10px); }
    100% { transform: scale(1.2) translate(0px, 0px); filter: brightness(1) sepia(0.3); }
  }

  /* Adding 90s film grain overlay */
  .grain {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0.15;
    background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
  }

  /* Neon pulsing overlay for bar lighting */
  .neon-pulse {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(255,0,0,0.1) 80%);
    animation: neon 2s infinite alternate;
    z-index: 5;
  }
  
  @keyframes neon {
    0% { background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,200,255,0.1) 100%); }
    100% { background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(255,100,0,0.2) 100%); }
  }
  
</style>
</head>
<body>
  <div class="container">
    <div class="bg-image"></div>
    <div class="neon-pulse"></div>
    <div class="grain"></div>
  </div>
</body>
</html>
