<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StackLabs Living Mission Control // Artemis Pascal</title>
  <script src="hls.min.js"></script>
  <script>if (typeof Hls === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"><\/script>');</script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      background-color: #0B0D13;
      color: #E2E8F0;
      font-family: 'JetBrains Mono', monospace, -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .video-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #0B0D13;
    }
    .hud-overlay {
      position: absolute;
      top: 16px;
      left: 20px;
      padding: 6px 12px;
      background: rgba(11, 13, 19, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #00FF88;
      pointer-events: none;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
      transition: opacity 0.5s ease;
    }
    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00FF88;
      box-shadow: 0 0 8px #00FF88;
      animation: pulse 1.5s infinite;
    }
    .hud-overlay.hidden {
      opacity: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    /* Mobile Landscape Optimization */
    @media (max-width: 900px) and (orientation: portrait) {
      .hud-overlay {
        top: 8px;
        left: 8px;
        font-size: 9px;
      }
    }
  </style>
</head>
<body>
  <div class="video-viewport">
    <div id="hud" class="hud-overlay">
      <div class="hud-dot"></div>
      <span id="hud-text">SYNCHRONIZING LIVING MISSION CONTROL...</span>
    </div>
    <video id="videoPlayer" autoplay muted playsinline controls></video>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const hud = document.getElementById('hud');
    const hudText = document.getElementById('hud-text');
    const streamUrl = '/master_grid.m3u8';

    function setHudStatus(text, color, hideAfterMs = null) {
      hudText.innerText = text;
      hud.style.borderColor = color;
      hud.classList.remove('hidden');
      if (hideAfterMs) {
        setTimeout(() => hud.classList.add('hidden'), hideAfterMs);
      }
    }

    if (Hls.isSupported()) {
      const hls = new Hls({
        liveSyncDurationCount: 2,
        liveMaxLatencyDurationCount: 4,
        maxBufferLength: 8,
        maxMaxBufferLength: 12,
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 0
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setHudStatus('MISSION CONTROL ATTACHED // BUFFERING', '#00F0FF');
        video.play().catch(e => console.log('Autoplay deferred:', e));
      });

      hls.on(Hls.Events.FRAG_BUFFERED, () => {
        setHudStatus('MISSION CONTROL // 30.000 CFR NVENC', '#00FF88', 3500);
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              setHudStatus('NETWORK RECOVERY PENDING', '#FFB800');
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              setHudStatus('DECODE RECOVERY PENDING', '#EF4444');
              hls.recoverMediaError();
              break;
            default:
              setHudStatus('RECONNECTING TO METAL', '#EF4444');
              setTimeout(() => hls.loadSource(streamUrl), 2000);
              break;
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Native Apple Safari / iOS HLS
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => {
        setHudStatus('NATIVE APPLE HLS // PLAYING', '#00FF88', 3000);
        video.play();
      });
    }
  </script>
</body>
</html>
